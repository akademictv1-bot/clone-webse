<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E5C365"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3D2C"/>
      <stop offset="100%" stop-color="#051C14"/>
    </linearGradient>
  </defs>

  <!-- Brasão / Emblema -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#logoBg)" stroke="url(#logoGold)" stroke-width="1.8"/>
    <rect x="4" y="4" width="48" height="48" rx="10" fill="none" stroke="url(#logoGold)" stroke-width="0.7" stroke-dasharray="2.5 1.5" opacity="0.65"/>
    
    <!-- Monograma E Arquitetônico -->
    <path d="M16 18 Q28 9 40 18" fill="none" stroke="url(#logoGold)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="20" y1="18" x2="20" y2="43" stroke="url(#logoGold)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 20 L37 20 C38 20 38.5 21 38 22 L36.5 24.5 L20 24.5" fill="url(#logoGold)"/>
    <path d="M20 29 L32 29 L33.5 31 L32 33 L20 33" fill="url(#logoGold)"/>
    <path d="M20 39 L37 39 C38 39 38.5 40 37.5 41 L36 43.5 L20 43.5" fill="url(#logoGold)"/>
    <circle cx="28" cy="13" r="1.5" fill="#F9E8B8"/>
  </g>

  <!-- Tipografia da Marca -->
  <g transform="translate(74, 16)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', 'Playfair Display', Georgia, sans-serif" font-size="24" font-weight="800" fill="#082A1E" letter-spacing="0.08em">ENCLAVE</text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#9B7823" letter-spacing="0.28em">ACCOMMODATION · LUXURY STAYS</text>
  </g>
</svg>
