<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada | Enclave Accommodation</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #051C14;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 520px;
      padding: 48px 32px;
      background: rgba(8, 42, 30, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .logo {
      height: 60px;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #D4AF37;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      color: #A3B8B0;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #D4AF37;
      color: #051C14;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
    }
    .btn:hover {
      background: #F7EFCF;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(212, 175, 55, 0.35);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/logo.png" alt="Enclave Accommodation" class="logo" onerror="this.style.display='none'">
    <div class="badge">Erro 404</div>
    <h1>Página Não Encontrada</h1>
    <p>A acomodação ou página que procura pode ter sido movida ou não existe. Regresse à página principal para explorar os nossos retiros.</p>
    <a href="/" class="btn">Voltar à Página Inicial</a>
  </div>
</body>
</html>
